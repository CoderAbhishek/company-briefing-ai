<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Call Intel — HR Call Prep Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #c8ff00;
    --accent2: #00d4ff;
    --text: #e8e8f0;
    --muted: #7070a0;
    --danger: #ff4466;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,255,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,255,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  .tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    border: 1px solid rgba(200,255,0,0.3);
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: #fff;
    margin-bottom: 10px;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    letter-spacing: 0.02em;
  }

  /* Search */
  .search-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    margin-bottom: 32px;
    animation: fadeDown 0.6s 0.1s ease both;
  }

  .input-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .input-wrap {
    flex: 1;
    min-width: 220px;
    position: relative;
  }

  .input-wrap input[type="text"],
  .input-wrap input[type="password"],
  .input-wrap textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 12px 16px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
  }

  .input-wrap input[type="text"]:focus,
  .input-wrap input[type="password"]:focus,
  .input-wrap textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(200,255,0,0.1);
  }

  .input-wrap input::placeholder,
  .input-wrap textarea::placeholder { color: var(--muted); }

  /* File upload zone */
  .upload-zone {
    width: 100%;
    height: 116px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 18px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(200,255,0,0.03);
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-label {
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
  }

  .upload-label span {
    color: var(--accent);
    font-weight: 600;
  }

  .file-name {
    font-size: 11px;
    color: var(--accent2);
    margin-top: 6px;
    font-style: italic;
    display: none;
  }

  .input-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }

  .btn {
    background: var(--accent);
    color: #0a0a0f;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 12px 24px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    white-space: nowrap;
    width: 100%;
    margin-top: 12px;
  }

  .btn:hover { background: #d4ff1a; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Loading */
  .loading {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 48px 24px;
    text-align: center;
  }

  .loading.active { display: flex; }

  .loader-ring {
    width: 48px;
    height: 48px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .loading-text {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    animation: pulse 1.5s ease infinite;
  }

  /* Report */
  .report {
    display: none;
    animation: fadeUp 0.5s ease both;
  }

  .report.active { display: block; }

  .report-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .company-name {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }

  .timestamp {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    margin-top: 4px;
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }

  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Section cards */
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 16px;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }

  .section-icon {
    font-size: 15px;
    width: 24px;
    text-align: center;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .section-body {
    padding: 18px 20px;
    font-size: 13.5px;
    line-height: 1.8;
    color: #cccce0;
  }

  .section-body ul {
    list-style: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .section-body li {
    padding-left: 20px;
    position: relative;
    color: #cccce0;
  }

  .section-body li::before {
    content: '›';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: bold;
  }

  .highlight-box {
    background: rgba(200,255,0,0.05);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 4px 4px 0;
    margin-top: 12px;
    font-size: 13px;
    color: #e8e8c8;
    font-style: italic;
  }

  .talking-pt {
    background: rgba(0,212,255,0.05);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    color: #c8e8f0;
    line-height: 1.6;
  }

  .talking-pt:last-child { margin-bottom: 0; }

  .talking-pt strong {
    color: var(--accent2);
    font-weight: 600;
  }

  .q-item {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    color: #cccce0;
    line-height: 1.5;
    position: relative;
    padding-left: 32px;
  }

  .q-item::before {
    content: 'Q';
    position: absolute;
    left: 10px;
    top: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 11px;
    color: var(--accent);
  }

  .alert-bar {
    background: rgba(255,68,102,0.08);
    border: 1px solid rgba(255,68,102,0.25);
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 12.5px;
    color: #f0b0b8;
    line-height: 1.6;
  }

  .error-box {
    background: rgba(255,68,102,0.08);
    border: 1px solid rgba(255,68,102,0.2);
    border-radius: 6px;
    padding: 20px;
    text-align: center;
    color: var(--danger);
    font-size: 13px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity:0.5 } 50% { opacity:1 } }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="tag">// Pre-Call Intel</div>
    <h1>Know Before<br>You <span>Call.</span></h1>
    <p class="subtitle">Walk into your HR screening call sounding like you've been following them for months.</p>
  </div>

  <div class="search-block" id="searchBlock">

    <!-- Row 1: API Key -->
    <div style="margin-bottom:16px;">
      <label class="input-label">① Anthropic API Key</label>
      <div class="input-wrap" style="min-width:100%;">
        <input type="password" id="apiKeyInput" placeholder="sk-ant-... — used only for this request, never stored" />
      </div>
    </div>

    <!-- Row 2: Resume + JD side by side -->
    <div class="input-row" style="margin-bottom:16px;">
      <div style="flex:1;min-width:220px;">
        <label class="input-label">② Upload Your Resume</label>
        <div class="upload-zone" id="resumeZone">
          <input type="file" id="resumeFile" accept=".pdf,.docx,.txt" onchange="handleResumeUpload(this)" />
          <div class="upload-label">Drop file or <span>click to browse</span><br>PDF · DOCX · TXT</div>
          <div class="file-name" id="resumeFileName"></div>
        </div>
      </div>
      <div style="flex:1;min-width:220px;">
        <label class="input-label">③ Job Role / Description</label>
        <div class="input-wrap" style="min-width:100%;">
          <textarea id="roleInput" rows="4" style="height:116px;" placeholder="Paste the job title or full job description here..."></textarea>
        </div>
      </div>
    </div>

    <!-- Row 3: Company + Button -->
    <div style="margin-bottom:4px;">
      <label class="input-label">④ Company Name</label>
      <div class="input-wrap" style="min-width:100%;">
        <input type="text" id="companyInput" placeholder="e.g. Google, Amazon, Microsoft..." />
      </div>
    </div>

    <button class="btn" id="goBtn" onclick="runBriefing()">Generate My Briefing →</button>
    <div style="margin-top:10px;font-size:11px;color:var(--muted);">🔒 Your API key and resume are used only for this request and never stored or sent anywhere else.</div>
  </div>

  <div class="loading" id="loading">
    <div class="loader-ring"></div>
    <div class="loading-text" id="loadingText">Scanning company signals...</div>
  </div>

  <div class="report" id="report"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
const loadingMessages = [
  "Reading your resume...",
  "Scanning company signals...",
  "Pulling recent news & funding data...",
  "Mapping your background to the role...",
  "Crafting your talking points...",
  "Preparing smart questions to ask...",
  "Almost ready..."
];

let loadingInterval;
let resumeData = null; // { type: 'pdf'|'text', content: string }

function startLoadingCycle() {
  let i = 0;
  document.getElementById('loadingText').textContent = loadingMessages[0];
  loadingInterval = setInterval(() => {
    i = (i + 1) % loadingMessages.length;
    document.getElementById('loadingText').textContent = loadingMessages[i];
  }, 2200);
}

function stopLoadingCycle() { clearInterval(loadingInterval); }

async function handleResumeUpload(input) {
  const file = input.files[0];
  if (!file) return;

  const nameEl = document.getElementById('resumeFileName');
  nameEl.textContent = '⏳ Reading file...';
  nameEl.style.display = 'block';

  try {
    const ext = file.name.split('.').pop().toLowerCase();

    if (ext === 'pdf') {
      const base64 = await fileToBase64(file);
      resumeData = { type: 'pdf', content: base64 };
    } else if (ext === 'docx') {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      resumeData = { type: 'text', content: result.value };
    } else {
      const text = await file.text();
      resumeData = { type: 'text', content: text };
    }

    nameEl.textContent = `✓ ${file.name}`;
  } catch (err) {
    nameEl.textContent = `✗ Error reading file`;
    nameEl.style.color = 'var(--danger)';
    resumeData = null;
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function runBriefing() {
  const apiKey  = document.getElementById('apiKeyInput').value.trim();
  const company = document.getElementById('companyInput').value.trim();
  const role    = document.getElementById('roleInput').value.trim();

  if (!apiKey)    { alert('Please paste your Anthropic API key.'); document.getElementById('apiKeyInput').focus(); return; }
  if (!resumeData){ alert('Please upload your resume first.'); return; }
  if (!company)   { alert('Please enter the company name.'); document.getElementById('companyInput').focus(); return; }
  if (!role)      { alert('Please enter the job role or paste the job description.'); document.getElementById('roleInput').focus(); return; }

  const btn = document.getElementById('goBtn');
  btn.disabled = true;
  document.getElementById('searchBlock').style.opacity = '0.5';
  document.getElementById('loading').classList.add('active');
  document.getElementById('report').classList.remove('active');
  startLoadingCycle();

  // Build the user content block
  const instruction = `You are an HR call preparation assistant. The user has an HR screening call coming up at "${company}" for the role: "${role}". They have shared their resume. Your job is to make them sound genuinely informed and impressive to the HR — not to prep them for a deep technical interview.

Do the following using live web search:
1. Search for the latest news about "${company}" — funding rounds, product launches, key hires, expansions, partnerships, awards (especially the last 6 months). Focus on things that are easy to casually reference in conversation.
2. Look up what "${company}" does, its stage, size, and core product or service — explained simply.
3. Read the user's resume. Identify 3-4 ways their background naturally connects to why they would care about this company and this role.
4. Generate 3 smart, specific questions they can ask the HR that will make them sound genuinely curious and well-researched — not generic questions found on any job prep site.

Return a structured JSON object ONLY (no markdown, no backticks, no extra text) with this exact shape:
{
  "companyOverview": "2-3 sentence plain-English summary of what the company does, its current stage, and why it matters",
  "recentHighlights": ["item1", "item2", "item3", "item4"],
  "whyYouFit": ["LABEL: description", "LABEL: description", "LABEL: description", "LABEL: description"],
  "smartQuestions": ["question 1", "question 2", "question 3"],
  "watchOut": "One practical tip for navigating this HR call well — a talking point to prepare, a gap to address, or something the HR will likely ask (can be empty string)"
}`;

  let userContent;
  if (resumeData.type === 'pdf') {
    userContent = [
      { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: resumeData.content } },
      { type: 'text', text: instruction }
    ];
  } else {
    userContent = [
      { type: 'text', text: `RESUME CONTENT:\n\n${resumeData.content}\n\n---\n\n${instruction}` }
    ];
  }

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "anthropic-version": "2023-06-01",
        "x-api-key": apiKey,
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1200,
        tools: [{ type: "web_search_20250305", name: "web_search" }],
        messages: [{ role: "user", content: userContent }]
      })
    });

    const data = await response.json();
    stopLoadingCycle();
    document.getElementById('loading').classList.remove('active');
    document.getElementById('searchBlock').style.opacity = '1';
    btn.disabled = false;

    if (data.error) throw new Error(data.error.message);

    let rawText = '';
    for (const block of data.content || []) {
      if (block.type === 'text') rawText += block.text;
    }

    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("Could not parse response. Try again.");
    const result = JSON.parse(jsonMatch[0]);

    renderReport(company, role, result);

  } catch (err) {
    stopLoadingCycle();
    document.getElementById('loading').classList.remove('active');
    document.getElementById('searchBlock').style.opacity = '1';
    btn.disabled = false;
    document.getElementById('report').innerHTML = `<div class="error-box">⚠ ${err.message}</div>`;
    document.getElementById('report').classList.add('active');
  }
}

function renderReport(company, role, data) {
  const now = new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
  const reportEl = document.getElementById('report');

  const highlights = (data.recentHighlights || []).map(h => `<li>${h}</li>`).join('');
  const whyYou = (data.whyYouFit || []).map(p => {
    const colonIdx = p.indexOf(':');
    if (colonIdx > 0 && colonIdx < 40) {
      const label = p.slice(0, colonIdx).trim();
      const desc  = p.slice(colonIdx + 1).trim();
      return `<div class="talking-pt"><strong>${label}:</strong> ${desc}</div>`;
    }
    return `<div class="talking-pt">${p}</div>`;
  }).join('');
  const questions = (data.smartQuestions || []).map(q => `<div class="q-item">${q}</div>`).join('');
  const watchOut = data.watchOut
    ? `<div class="section" style="animation-delay:0.4s"><div class="section-head"><span class="section-icon">⚠</span><span class="section-title">Watch Out For</span></div><div class="section-body"><div class="alert-bar">${data.watchOut}</div></div></div>`
    : '';

  reportEl.innerHTML = `
    <div class="report-header">
      <div>
        <div class="company-name">${company} ${role ? `— ${role.slice(0,60)}${role.length>60?'...':''}` : ''}</div>
        <div class="timestamp">HR call brief generated at ${now}</div>
      </div>
      <button class="reset-btn" onclick="resetForm()">← New Search</button>
    </div>

    <div class="section" style="animation-delay:0.05s">
      <div class="section-head"><span class="section-icon">🏢</span><span class="section-title">Company Overview</span></div>
      <div class="section-body">${data.companyOverview || 'No overview available.'}</div>
    </div>

    <div class="section" style="animation-delay:0.1s">
      <div class="section-head"><span class="section-icon">⚡</span><span class="section-title">Recent Highlights (Last 6 Months)</span></div>
      <div class="section-body"><ul>${highlights || '<li>No recent highlights found.</li>'}</ul></div>
    </div>

    <div class="section" style="animation-delay:0.2s">
      <div class="section-head"><span class="section-icon">🎯</span><span class="section-title">Why You Fit — Talking Points</span></div>
      <div class="section-body">${whyYou || 'No talking points generated.'}</div>
    </div>

    <div class="section" style="animation-delay:0.3s">
      <div class="section-head"><span class="section-icon">💬</span><span class="section-title">Smart Questions to Ask HR</span></div>
      <div class="section-body">${questions || 'No questions generated.'}</div>
    </div>

    ${watchOut}
  `;

  reportEl.classList.add('active');
}

function resetForm() {
  document.getElementById('companyInput').value = '';
  document.getElementById('roleInput').value = '';
  document.getElementById('resumeFile').value = '';
  document.getElementById('resumeFileName').style.display = 'none';
  resumeData = null;
  document.getElementById('report').classList.remove('active');
  document.getElementById('report').innerHTML = '';
}
</script>
</body>
</html>
