<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Call Intel Briefing</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #c8ff00;
    --accent2: #00d4ff;
    --text: #e8e8f0;
    --muted: #7070a0;
    --danger: #ff4466;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
 
  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,255,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,255,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
 
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }
 
  /* Header */
  .header {
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }
 
  .tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    border: 1px solid rgba(200,255,0,0.3);
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
 
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: #fff;
    margin-bottom: 10px;
  }
 
  h1 span {
    color: var(--accent);
  }
 
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    letter-spacing: 0.02em;
  }
 
  /* Search */
  .search-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    margin-bottom: 32px;
    animation: fadeDown 0.6s 0.1s ease both;
  }
 
  .input-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
 
  .input-wrap {
    flex: 1;
    min-width: 220px;
    position: relative;
  }
 
  .input-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }
 
  .input-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(200,255,0,0.1);
  }
 
  .input-wrap input::placeholder { color: var(--muted); }
 
  .role-input {
    flex: 0.7;
    min-width: 180px;
  }
 
  .btn {
    background: var(--accent);
    color: #0a0a0f;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 12px 24px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    white-space: nowrap;
  }
 
  .btn:hover { background: #d4ff1a; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
 
  /* Loading */
  .loading {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 48px 24px;
    text-align: center;
  }
 
  .loading.active { display: flex; }
 
  .loader-ring {
    width: 48px;
    height: 48px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
 
  .loading-text {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    animation: pulse 1.5s ease infinite;
  }
 
  /* Report */
  .report {
    display: none;
    animation: fadeUp 0.5s ease both;
  }
 
  .report.active { display: block; }
 
  .report-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
 
  .company-name {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }
 
  .timestamp {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    margin-top: 4px;
  }
 
  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
 
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
 
  /* Section cards */
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 16px;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }
 
  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
 
  .section-icon {
    font-size: 15px;
    width: 24px;
    text-align: center;
  }
 
  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }
 
  .section-body {
    padding: 18px 20px;
    font-size: 13.5px;
    line-height: 1.8;
    color: #cccce0;
  }
 
  .section-body ul {
    list-style: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
 
  .section-body li {
    padding-left: 20px;
    position: relative;
    color: #cccce0;
  }
 
  .section-body li::before {
    content: '›';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: bold;
  }
 
  .highlight-box {
    background: rgba(200,255,0,0.05);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 4px 4px 0;
    margin-top: 12px;
    font-size: 13px;
    color: #e8e8c8;
    font-style: italic;
  }
 
  .talking-pt {
    background: rgba(0,212,255,0.05);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    color: #c8e8f0;
    line-height: 1.6;
  }
 
  .talking-pt:last-child { margin-bottom: 0; }
 
  .talking-pt strong {
    color: var(--accent2);
    font-weight: 600;
  }
 
  .q-item {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    color: #cccce0;
    line-height: 1.5;
    position: relative;
    padding-left: 32px;
  }
 
  .q-item::before {
    content: 'Q';
    position: absolute;
    left: 10px;
    top: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 11px;
    color: var(--accent);
  }
 
  .alert-bar {
    background: rgba(255,68,102,0.08);
    border: 1px solid rgba(255,68,102,0.25);
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 12.5px;
    color: #f0b0b8;
    line-height: 1.6;
  }
 
  .error-box {
    background: rgba(255,68,102,0.08);
    border: 1px solid rgba(255,68,102,0.2);
    border-radius: 6px;
    padding: 20px;
    text-align: center;
    color: var(--danger);
    font-size: 13px;
  }
 
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity:0.5 } 50% { opacity:1 } }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">
 
  <div class="header">
    <div class="tag">// Pre-Call Intel</div>
    <h1>Know Before<br>You <span>Call.</span></h1>
    <p class="subtitle">Real-time company briefing — built for your next interview or HR call</p>
  </div>
 
  <div class="search-block" id="searchBlock">
    <div class="input-row" style="margin-bottom:10px;">
      <div class="input-wrap" style="flex:1;min-width:100%;">
        <input type="password" id="apiKeyInput" placeholder="Paste your Anthropic API key (sk-ant-...) — not stored anywhere" />
      </div>
    </div>
    <div class="input-row">
      <div class="input-wrap">
        <input type="text" id="companyInput" placeholder="Company name (e.g. EyeROV, Razorpay...)" />
      </div>
      <div class="input-wrap role-input">
        <input type="text" id="roleInput" placeholder="Role (e.g. Founder's Office)" />
      </div>
      <button class="btn" id="goBtn" onclick="runBriefing()">Brief Me →</button>
    </div>
    <div style="margin-top:10px;font-size:11px;color:var(--muted);">🔒 Your API key is used only for this request and never stored or sent anywhere else.</div>
  </div>
 
  <div class="loading" id="loading">
    <div class="loader-ring"></div>
    <div class="loading-text" id="loadingText">Scanning company signals...</div>
  </div>
 
  <div class="report" id="report"></div>
 
</div>
 
<script>
const loadingMessages = [
  "Scanning company signals...",
  "Pulling recent news & funding data...",
  "Mapping role to your background...",
  "Crafting your talking points...",
  "Preparing smart questions to ask...",
  "Almost ready..."
];
 
let loadingInterval;
 
function startLoadingCycle() {
  let i = 0;
  document.getElementById('loadingText').textContent = loadingMessages[0];
  loadingInterval = setInterval(() => {
    i = (i + 1) % loadingMessages.length;
    document.getElementById('loadingText').textContent = loadingMessages[i];
  }, 2200);
}
 
function stopLoadingCycle() {
  clearInterval(loadingInterval);
}
 
async function runBriefing() {
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  const company = document.getElementById('companyInput').value.trim();
  const role = document.getElementById('roleInput').value.trim();
  if (!apiKey) { alert('Please paste your Anthropic API key first.'); document.getElementById('apiKeyInput').focus(); return; }
  if (!company) { document.getElementById('companyInput').focus(); return; }
 
  const btn = document.getElementById('goBtn');
  btn.disabled = true;
 
  document.getElementById('searchBlock').style.opacity = '0.5';
  document.getElementById('loading').classList.add('active');
  document.getElementById('report').classList.remove('active');
 
  startLoadingCycle();
 
  const prompt = `You are a pre-interview research assistant. The user is Abhishek Vinod — an MBA (Analytics) + B.Tech CSE professional with 3 years experience in strategy consulting and tech delivery. He is preparing for a call with HR at "${company}" for the role: "${role || 'Strategy / Founder\'s Office'}".
 
Do the following using live web search:
1. Search for the very latest news about "${company}" — funding rounds, product launches, key hires, awards, expansions, partnerships, contracts (especially from the last 6 months).
2. Look up what "${company}" does, its stage, team size, and core product/service.
3. Map Abhishek's background (strategy consulting, investor relations, ops dashboards, GCC market exposure, TCS tech background, AI tools) to what ${company} likely needs in this role.
 
Return a structured JSON object ONLY (no markdown, no backticks, no extra text) with this exact shape:
{
  "companyOverview": "2-3 sentence summary of what the company does, its stage, and its core focus",
  "recentHighlights": ["item1", "item2", "item3", "item4"],
  "whyYouFit": ["talking point 1 with LABEL: description format", "talking point 2", "talking point 3", "talking point 4"],
  "smartQuestions": ["question 1", "question 2", "question 3"],
  "watchOut": "One thing to be prepared for or a potential concern to address on the call (optional, can be empty string)"
}`;
 
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
          "Content-Type": "application/json",
          "anthropic-version": "2023-06-01",
          "x-api-key": apiKey
        },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        tools: [{ type: "web_search_20250305", name: "web_search" }],
        messages: [{ role: "user", content: prompt }]
      })
    });
 
    const data = await response.json();
    stopLoadingCycle();
    document.getElementById('loading').classList.remove('active');
    document.getElementById('searchBlock').style.opacity = '1';
    btn.disabled = false;
 
    // Extract text from response
    let rawText = '';
    for (const block of data.content || []) {
      if (block.type === 'text') rawText += block.text;
    }
 
    // Parse JSON
    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("No JSON found in response");
    const result = JSON.parse(jsonMatch[0]);
 
    renderReport(company, role, result);
 
  } catch (err) {
    stopLoadingCycle();
    document.getElementById('loading').classList.remove('active');
    document.getElementById('searchBlock').style.opacity = '1';
    btn.disabled = false;
    document.getElementById('report').innerHTML = `<div class="error-box">Something went wrong: ${err.message}</div>`;
    document.getElementById('report').classList.add('active');
  }
}
 
function renderReport(company, role, data) {
  const now = new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
  const reportEl = document.getElementById('report');
 
  const highlights = (data.recentHighlights || []).map(h => `<li>${h}</li>`).join('');
  const whyYou = (data.whyYouFit || []).map(p => {
    const [label, ...rest] = p.split(':');
    return rest.length
      ? `<div class="talking-pt"><strong>${label}:</strong> ${rest.join(':').trim()}</div>`
      : `<div class="talking-pt">${p}</div>`;
  }).join('');
  const questions = (data.smartQuestions || []).map(q => `<div class="q-item">${q}</div>`).join('');
  const watchOut = data.watchOut
    ? `<div class="section" style="animation-delay:0.4s"><div class="section-head"><span class="section-icon">⚠</span><span class="section-title">Watch Out For</span></div><div class="section-body"><div class="alert-bar">${data.watchOut}</div></div></div>`
    : '';
 
  reportEl.innerHTML = `
    <div class="report-header">
      <div>
        <div class="company-name">${company} ${role ? `— ${role}` : ''}</div>
        <div class="timestamp">Briefing generated at ${now}</div>
      </div>
      <button class="reset-btn" onclick="resetForm()">← New Search</button>
    </div>
 
    <div class="section" style="animation-delay:0.05s">
      <div class="section-head">
        <span class="section-icon">🏢</span>
        <span class="section-title">Company Overview</span>
      </div>
      <div class="section-body">${data.companyOverview || 'No overview available.'}</div>
    </div>
 
    <div class="section" style="animation-delay:0.1s">
      <div class="section-head">
        <span class="section-icon">⚡</span>
        <span class="section-title">Recent Highlights (Last 6 Months)</span>
      </div>
      <div class="section-body"><ul>${highlights || '<li>No recent highlights found.</li>'}</ul></div>
    </div>
 
    <div class="section" style="animation-delay:0.2s">
      <div class="section-head">
        <span class="section-icon">🎯</span>
        <span class="section-title">Why You Fit — Talking Points</span>
      </div>
      <div class="section-body">${whyYou || 'No talking points generated.'}</div>
    </div>
 
    <div class="section" style="animation-delay:0.3s">
      <div class="section-head">
        <span class="section-icon">💬</span>
        <span class="section-title">Smart Questions to Ask HR</span>
      </div>
      <div class="section-body">${questions || 'No questions generated.'}</div>
    </div>
 
    ${watchOut}
  `;
 
  reportEl.classList.add('active');
}
 
function resetForm() {
  document.getElementById('companyInput').value = '';
  document.getElementById('roleInput').value = '';
  document.getElementById('report').classList.remove('active');
  document.getElementById('report').innerHTML = '';
  document.getElementById('companyInput').focus();
}
 
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runBriefing();
});
</script>
</body>
</html>
